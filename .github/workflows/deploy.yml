name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Fetch fresh MSC data from GitHub API
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clone proposals repo
        run: git clone --depth 1 https://github.com/matrix-org/matrix-spec-proposals.git /tmp/msp-clone

      - name: Build MSC data
        env:
          MSP_GITHUB_TOKEN: ${{ secrets.MSP_GITHUB_TOKEN }}
          SITE_URL: https://litruv.github.io/matrixSpecExplorer
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.refresh_data }}" = "true" ]; then
            if ! node build-data.js; then
              echo "Full refresh failed — deploying with committed data"
              node build-data.js --share-pages-only
            fi
          else
            node build-data.js --share-pages-only
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
